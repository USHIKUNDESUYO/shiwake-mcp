name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 依存ライブラリを持たない設計なので npm install は無い。
      # dependencies が空のままであることを、テストと同じ重さで守る。
      - name: 依存ゼロを確認
        run: |
          node -e '
            const p = require("./package.json");
            const d = Object.keys(p.dependencies ?? {});
            const v = Object.keys(p.devDependencies ?? {});
            if (d.length || v.length) {
              console.error("依存が追加されています:", [...d, ...v].join(", "));
              process.exit(1);
            }
            console.log("dependencies / devDependencies ともに空です");
          '
          test ! -f package-lock.json || (echo "package-lock.json があります" && exit 1)

      - name: テスト
        run: npm test

      - name: サンプルデータの再現性を確認
        run: |
          node examples/generate.js > /tmp/regenerated.json
          diff -q examples/journals.sample.json /tmp/regenerated.json \
            || (echo "固定シードのはずのサンプルデータが一致しません" && exit 1)

      - name: CLI が動くことを確認
        run: npm run demo
